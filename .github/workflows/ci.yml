name: Disaster Tweets CI

on:
  push:
  pull_request:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Accélère le CI en gardant les librairies en mémoire cache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CI ciblé sur l'API (évite d'installer les dépendances ML lourdes)
          if [ -f API/requirements.txt ]; then pip install -r API/requirements.txt; fi
          pip install ruff pytest mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Type checking 
        # Vérifie si les fonctions reçoivent les bons types de données
        run: |
          mypy API/ --ignore-missing-imports || echo "Mypy a trouvé des soucis de type, à vérifier."

      - name: Run tests (pytest)
        run: |
          pytest
          